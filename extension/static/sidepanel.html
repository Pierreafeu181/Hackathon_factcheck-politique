<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Vérif'Pol</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <h1>Vérif'Pol</h1>
      <nav>
        <button class="tab active" data-tab="chat">Chat</button>
        <button class="tab" data-tab="watch">Veille</button>
      </nav>
    </header>

    <section id="tab-chat">
      <div id="ctx" class="ctx">Ouvrez une vidéo YouTube : elle sera vérifiée automatiquement.</div>
      <div id="thread" aria-live="polite"></div>
      <div id="chips"></div>
      <form id="ask">
        <textarea id="question" rows="1" placeholder="Pose ta question…"></textarea>
        <button id="send" type="submit" title="Envoyer">↑</button>
      </form>
    </section>

    <section id="tab-watch" hidden>
      <div class="row">
        <button id="refresh">Relancer la veille</button>
        <span id="watch-meta" class="meta"></span>
      </div>
      <p id="watch-status" class="status"></p>
      <ol id="episodes" class="episodes"></ol>
    </section>

    <footer>
      <label>
        Serveur
        <input id="backend" type="url" spellcheck="false" />
      </label>
    </footer>

    <script src="sidepanel.js"></script>
  </body>
</html>
